interface=wlan0
ctrl_interface=/var/run/hostapd
driver=nl80211
ssid=dual_link_mlo_sap
channel=0
ieee80211n=1
ieee80211ac=1
ieee80211ax=1
ieee80211be=1
he_su_beamformer=1
he_su_beamformee=1
he_mu_beamformer=1
he_twt_required=1
hw_mode=a
sae_pwe=1
op_class=134
ignore_broadcast_ssid=0
wowlan_triggers=any
interworking=1
access_network_type=2

wpa=2
rsn_pairwise=CCMP
wpa_key_mgmt=SAE
ieee80211w=2
sae_require_mfp=1
wpa_passphrase=1234567890
sae_password=1234567890
beacon_prot=1
mld_ap=1