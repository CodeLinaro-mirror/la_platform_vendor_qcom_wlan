interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
ssid=320m_sap

hw_mode=a
op_class=137
channel=65
beacon_int=100
wmm_enabled=1
max_num_sta=255
ieee80211n=1
ieee80211ac=1
ieee80211ax=1
ieee80211be=1
he_su_beamformer=1
he_su_beamformee=1
he_mu_beamformer=1
he_twt_required=1

ht_capab=[HT40+]
vht_oper_chwidth=9
he_oper_chwidth=9
eht_oper_chwidth=9
he_oper_centr_freq_seg0_idx=63
eht_oper_centr_freq_seg0_idx=63

ignore_broadcast_ssid=0

wpa=2
rsn_pairwise=CCMP
wpa_key_mgmt=SAE
sae_pwe=1
ieee80211w=2
sae_require_mfp=1
wpa_passphrase=1234567890
sae_password=1234567890
beacon_prot=1
