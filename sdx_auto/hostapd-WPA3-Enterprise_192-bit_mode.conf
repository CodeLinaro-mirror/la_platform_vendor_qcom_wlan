interface=wlan0
driver=nl80211

ctrl_interface=/var/run/hostapd
ctrl_interface_group=radio

ssid=QSoftAP
hw_mode=a
channel=149

country_code=US
beacon_int=100

macaddr_acl=0
wpa=2

# Set of accepted key management algorithms, WPA-EAP for WPA2-Enterprise mode,
# WPA-EAP-SHA256 for WPA3-Enterprise only mode, WPA-EAP-SUITE-B-192 for
# WPA3-Enterprise 192-bit mode.
wpa_key_mgmt=WPA-EAP-SUITE-B-192

# Set of accepted cipher suites (encryption algorithms) for pairwise keys.
# Group cipher suite (encryption algorithm for broadcast and multicast frames)
# is automatically selected based on this configuration.
rsn_pairwise=GCMP-256
group_cipher=GCMP-256
group_mgmt_cipher=BIP-GMAC-256

# ieee80211w: Whether management frame protection (MFP) is enabled
# 0 = disabled
# 1 = optional
# 2 = required
ieee80211w=2

# Use integrated EAP server instead of external RADIUS authentication
# server. This is also needed if hostapd is configured to act as a RADIUS
# authentication server.
eap_server=0

# Path for EAP server user database
# If SQLite support is included, this can be set to "sqlite:/path/to/sqlite.db"
# to use SQLite database instead of a text file.
eap_user_file=/etc/misc/wifi/hostapd.eap_user_tls

# RADIUS authentication server
auth_server_addr=192.168.1.100
auth_server_port=1812
auth_server_shared_secret=wakiki_secret

# Require IEEE 802.1X authorization
ieee8021x=1

ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]

ieee80211ac=1
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=1

require_vht=1
ieee80211ax=1
he_bss_color=63
he_su_beamformer=1
he_su_beamformee=1
he_mu_beamformer=1
he_default_pe_duration=4
he_twt_required=1
he_rts_threshold=16

he_oper_chwidth=1

wps_state=2
ap_setup_locked=1

config_methods=virtual_display virtual_push_button keypad
